name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show project files
        run: |
          echo "===== package.json ====="
          cat package.json
          echo ""
          echo "===== app.json ====="
          cat app.json
          echo ""
          echo "===== eas.json ====="
          cat eas.json

      - name: Test Expo configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "===== Expo version ====="
          npx expo --version

          echo "===== Expo config ====="
          set +e
          npx expo config --json
          EXIT_CODE=$?
          echo "===== Expo config exit code: $EXIT_CODE ====="

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Expo configuration failed."
            exit "$EXIT_CODE"
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
