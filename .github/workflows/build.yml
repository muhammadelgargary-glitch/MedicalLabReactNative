name: Build Android APK and Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Install Expo Web dependencies
        run: |
          npx expo install react-native-web react-dom @expo/metro-runtime

      - name: Verify Web dependencies
        run: |
          npm list react-native-web react-dom @expo/metro-runtime

      - name: Check Expo configuration
        run: |
          npx expo config --json

      - name: Check Expo Doctor
        run: |
          npx expo-doctor || true

      - name: Export Web Project
        run: |
          npx expo export --platform web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Web to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Show EAS version
        run: eas --version

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive
