name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: production

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 Verify project configuration
        run: |
          echo "===== Node Version ====="
          node --version
          echo ""
          echo "===== npm Version ====="
          npm --version
          echo ""
          echo "===== Expo CLI Version ====="
          npx expo --version
          echo ""
          echo "===== Checking app.json ====="
          cat app.json | head -20

      - name: ✅ Validate Expo configuration
        run: |
          echo "===== Testing npx expo config --json ====="
          if npx expo config --json > /dev/null 2>&1; then
            echo "✅ Expo config is valid"
          else
            echo "⚠️ Expo config validation had issues (continuing)"
          fi

      - name: 🛠️ Setup EAS CLI
        run: |
          npm install -g eas-cli@latest

      - name: 🔐 Verify Expo Token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is configured"
          fi

      - name: 🏗️ Build Android APK (Preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS build for Android (preview profile)..."
          eas build --platform android --profile preview --non-interactive

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            expo-config-output.txt
          retention-days: 7

      - name: ✅ Build completed successfully
        if: success()
        run: |
          echo "🎉 Android APK build completed successfully!"
          echo "Check your EAS Build dashboard for the output file."

      - name: ❌ Build failed
        if: failure()
        run: |
          echo "Build failed. Please check:"
          echo "1. EXPO_TOKEN in GitHub Secrets"
          echo "2. app.json configuration"
          echo "3. eas.json build profiles"
          echo "4. Android permissions and package name"
          exit 1
          
