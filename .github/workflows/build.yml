name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Show Expo version
        run: |
          echo "===== Expo CLI version ====="
          npx expo --version

      - name: Verify Expo configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_DEBUG: "1"
        shell: bash
        run: |
          echo "========================================"
          echo "        EXPO CONFIG DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "===== Node ====="
          node --version

          echo ""
          echo "===== npm ====="
          npm --version

          echo ""
          echo "===== Expo CLI ====="
          npx expo --version

          echo ""
          echo "===== Expo Doctor ====="
          npx expo-doctor || true

          echo ""
          echo "===== Expo Config ====="
          npx expo config --json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Show EAS CLI version
        run: eas --version

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive
