name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Expo version
        run: |
          node --version
          npm --version
          npx expo --version

      - name: Expo config diagnostic
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          echo "===== Running Expo config ====="
          npx expo config --json > expo-config-output.txt 2>&1
          EXIT_CODE=$?

          echo "===== Exit code: $EXIT_CODE ====="
          echo "===== Output ====="
          cat expo-config-output.txt

          exit 0

      - name: Upload Expo diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-config-diagnostic
          path: expo-config-output.txt

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
